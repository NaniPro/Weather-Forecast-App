<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Weather Forecast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital@0;1&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    
</head>
<body>
<div class="weatherContainer" id="weatherForecast">
    <div class="WeatherHeader">
            <h1 class="weatherCity" id="City" autocorrect="off" >Search City:</h1>
            <input type="search" class="searchCity" id="searchField" placeholder="Search" autocorrect="off" required><button id="citySearch" class="citySearch"><span class="material-symbols-outlined">search</span></button>
    </div>

    <div class="weatherDetails">
        <span class="weatherTemp" id="Temp"></span>
        <span class="weatherState" id="State"></span>
        <span class="weatherWind" id="Wind"></span>
        <span id="windDirection"></span>
        <span id="relHumidity"></span>
        <span id="Time"></span>
    </div>


</div>
</body>
<script src="index.js"></script>
</html>
